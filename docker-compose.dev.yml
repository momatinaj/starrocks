x-dev-base: &dev-base
  image: starrocks/dev-env-ubuntu:latest
  volumes:
    - .:/workspace
    - /tmp/.m2:/tmp/.m2
    - /tmp/.ccache:/tmp/.ccache
  working_dir: /workspace
  environment:
    - STARROCKS_HOME=/workspace
    - STARROCKS_THIRDPARTY=/var/local/thirdparty
    - HOME=/tmp
    - CCACHE_DIR=/tmp/.ccache
    - CCACHE_MAXSIZE=20G
    - BUILD_TYPE=DEBUG
    - MAVEN_OPTS=-Dmaven.repo.local=/tmp/.m2/repository -Duser.home=/tmp
    - UDF_RUNTIME_DIR=/workspace
    - LD_LIBRARY_PATH=/lib/jvm/java-17-openjdk/lib/server:/var/local/thirdparty/installed/jemalloc/lib-shared:/opt/gcc-toolset-14/lib64
    - STARROCKS_GCC_HOME=/opt/gcc-toolset-14
    - http_proxy=${http_proxy}
    - https_proxy=${https_proxy}
  user: root
  tty: true
  privileged: true

services:
  dev:
    <<: *dev-base
    container_name: starrocks-dev-env
    stdin_open: true
    command: /bin/bash
    networks:
      - starrocks-dev

  gensrc:
    <<: *dev-base
    container_name: starrocks-gensrc
    command: bash -c 'cd gensrc && make -j${PARALLEL:-28}'

  build-fe:
    <<: *dev-base
    container_name: starrocks-build-fe
    command: bash -lc 'git config --global --add safe.directory /workspace && ./build.sh --fe -j ${PARALLEL:-28}'

  build-be:
    <<: *dev-base
    container_name: starrocks-build-be
    command: bash -lc 'git config --global --add safe.directory /workspace && ./build.sh --be -j ${PARALLEL:-28}'

  test-fe:
    <<: *dev-base
    container_name: starrocks-test-fe
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-fe-ut.sh -j ${PARALLEL:-28}'

  test-be:
    <<: *dev-base
    container_name: starrocks-test-be
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-be-ut.sh --without-java-ext -j ${PARALLEL:-28}'

  test-be-vector:
    <<: *dev-base
    container_name: starrocks-test-be-vector
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-be-ut.sh --gtest_filter "VectorIndexSearchTest.*" --without-java-ext -j ${PARALLEL:-28}'

  test-be-geo:
    <<: *dev-base
    container_name: starrocks-test-be-geo
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-be-ut.sh --gtest_filter "S2CellUtilsTest.*" --without-java-ext -j ${PARALLEL:-28}'

  test-be-partition-meta:
    <<: *dev-base
    container_name: starrocks-test-be-partition-meta
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-be-ut.sh --gtest_filter "SpatialPartitionMetaTest.*" --without-java-ext -j ${PARALLEL:-28}'

  test-be-spatial-writer:
    <<: *dev-base
    container_name: starrocks-test-be-spatial-writer
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-be-ut.sh --gtest_filter "SpatialVectorIndexWriterTest.*" --without-java-ext -j ${PARALLEL:-28}'

  test-be-spatial-reader:
    <<: *dev-base
    container_name: starrocks-test-be-spatial-reader
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-be-ut.sh --gtest_filter "SpatialVectorIndexReader*" --without-java-ext -j ${PARALLEL:-28}'

  test-be-spatial-vector:
    <<: *dev-base
    container_name: starrocks-test-be-spatial-vector
    command: bash -lc 'git config --global --add safe.directory /workspace && ./run-be-ut.sh --gtest_filter "S2CellUtilsTest.*:VectorIndexSearchTest.*:SpatialPartitionMetaTest.*:SpatialVectorIndexWriterTest.*:SpatialVectorIndexReader*" --without-java-ext -j ${PARALLEL:-28}'

  # ---- Benchmark: Official StarRocks baseline (A0) ----
  starrocks-baseline:
    image: starrocks/allin1-ubuntu:latest
    container_name: starrocks-baseline
    ports:
      - "19030:9030"
      - "18030:8030"
      - "18040:8040"
    tty: true
    networks:
      - starrocks-bench

  # ---- Benchmark: Custom-built FE (B2 / A2) ----
  starrocks-custom-fe:
    <<: *dev-base
    container_name: starrocks-custom-fe
    ports:
      - "9030:9030"
      - "8030:8030"
    networks:
      - starrocks-bench
    command:
      - bash
      - -lc
      - |
        export STARROCKS_HOME=/workspace/output/fe
        if [ ! -d "$$STARROCKS_HOME/lib" ]; then
          echo "ERROR: FE has not been built yet. Run 'docker compose run --rm build-fe' first."
          exit 1
        fi
        # Clean stale metadata from previous failed starts
        rm -rf $$STARROCKS_HOME/meta/bdb $$STARROCKS_HOME/meta/image
        mkdir -p $$STARROCKS_HOME/meta $$STARROCKS_HOME/log
        # Set priority_networks so FE binds to the Docker bridge IP
        MY_IP=$$(hostname -I | awk '{print $$1}')
        SUBNET=$$(echo $$MY_IP | cut -d. -f1-2).0.0/16
        echo "Detected IP=$$MY_IP, setting priority_networks=$$SUBNET"
        sed -i '/^priority_networks/d' $$STARROCKS_HOME/conf/fe.conf
        echo "priority_networks = $$SUBNET" >> $$STARROCKS_HOME/conf/fe.conf
        exec $$STARROCKS_HOME/bin/start_fe.sh --logconsole

  # ---- Benchmark: Custom-built BE (B2 / A2) ----
  starrocks-custom-be:
    <<: *dev-base
    container_name: starrocks-custom-be
    ports:
      - "8040:8040"
    depends_on:
      - starrocks-custom-fe
    networks:
      - starrocks-bench
    command:
      - bash
      - -lc
      - |
        export STARROCKS_HOME=/workspace/output/be
        if [ ! -f "$$STARROCKS_HOME/lib/starrocks_be" ]; then
          echo "ERROR: BE has not been built yet. Run 'docker compose run --rm build-be' first."
          exit 1
        fi
        echo "Waiting for FE query port (9030) to be ready..."
        until python3 -c "import socket; s=socket.create_connection(('starrocks-custom-fe',9030),3); s.close()" 2>/dev/null; do
          sleep 3
        done
        sleep 5
        echo "FE is ready. Registering BE via HTTP SQL API..."
        for i in 1 2 3; do
          RESP=$$(curl -s -u root: -XPOST \
            'http://starrocks-custom-fe:8030/api/v1/catalogs/default_catalog/databases/information_schema/sql' \
            -H 'Content-Type: application/json' \
            -d '{"query":"ALTER SYSTEM ADD BACKEND '"'"'starrocks-custom-be:9050'"'"'"}' 2>&1)
          echo "Registration attempt $$i: $$RESP"
          echo "$$RESP" | grep -q '"status":"OK"\|already exists' && break
          sleep 5
        done
        echo "BE registered. Starting backend..."
        mkdir -p $$STARROCKS_HOME/storage $$STARROCKS_HOME/log
        # Set priority_networks so BE binds to the Docker bridge IP
        MY_IP=$$(hostname -I | awk '{print $$1}')
        SUBNET=$$(echo $$MY_IP | cut -d. -f1-2).0.0/16
        sed -i '/^priority_networks/d' $$STARROCKS_HOME/conf/be.conf
        echo "priority_networks = $$SUBNET" >> $$STARROCKS_HOME/conf/be.conf
        exec $$STARROCKS_HOME/bin/start_be.sh --logconsole

networks:
  starrocks-dev:
    driver: bridge
  starrocks-bench:
    driver: bridge
