version: '3.8'

x-dev-base: &dev-base
  image: ${STARROCKS_DEV_ENV_IMAGE:-starrocks/dev-env-ubuntu:latest}
  volumes:
    - .:/workspace
    - ${MAVEN_CACHE:-./cache/m2}:/tmp/.m2
    - ${CCACHE_DIR:-./cache/ccache}:/tmp/.ccache
  working_dir: /workspace
  environment:
    - STARROCKS_HOME=/workspace
    - STARROCKS_THIRDPARTY=/var/local/thirdparty
    - HOME=/tmp
    - CCACHE_DIR=/tmp/.ccache
    - CCACHE_MAXSIZE=${CCACHE_MAXSIZE:-20G}
    - BUILD_TYPE=${BUILD_TYPE:-DEBUG}
  user: "${UID:-1000}:${GID:-1000}"

services:
  # Interactive shell for ad-hoc work
  dev:
    <<: *dev-base
    container_name: starrocks-dev-env
    stdin_open: true
    tty: true
    command: /bin/bash

  # Generate protobuf/thrift sources (run once after clone or proto changes)
  gensrc:
    <<: *dev-base
    container_name: starrocks-gensrc
    command: bash -c 'cd gensrc && make -j${PARALLEL:-8}'

  build-fe:
    <<: *dev-base
    container_name: starrocks-build-fe
    command: ./build.sh --fe -j ${PARALLEL:-8}

  build-be:
    <<: *dev-base
    container_name: starrocks-build-be
    command: ./build.sh --be -j ${PARALLEL:-8}

  test-fe:
    <<: *dev-base
    container_name: starrocks-test-fe
    command: ./run-fe-ut.sh -j ${PARALLEL:-8}

  test-be:
    <<: *dev-base
    container_name: starrocks-test-be
    command: ./run-be-ut.sh --without-java-ext -j ${PARALLEL:-8}

  # Targeted test: only run specific gtest filter
  test-be-vector:
    <<: *dev-base
    container_name: starrocks-test-be-vector
    command: >
      ./run-be-ut.sh
        --gtest_filter "VectorIndexSearchTest.*"
        --without-java-ext
        -j ${PARALLEL:-8}
